; https://docs.platformio.org/page/projectconf.html

[env:upesy_wroom]
platform = espressif32
board = upesy_wroom
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps = 
	esp32async/ESPAsyncWebServer@^3.8.1
	bblanchon/ArduinoJson@^7.4.2
